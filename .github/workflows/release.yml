name: Release

on:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify package version matches tag
        run: |
          set -euo pipefail

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ github.event.release.tag_name }}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json is $PACKAGE_VERSION but tag is $TAG_VERSION."
            echo "Before cutting a release, set package.json version to the exact tag (example: tag 1.0.2 -> version 1.0.2)."
            exit 1
          fi

          echo "Version check passed: package.json and tag are both $PACKAGE_VERSION."

  publish-npm:
    needs:
      - ci
      - verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token used by `npm publish --provenance` to authenticate against
      # the trusted-publisher configured for @feralfile/source-resolver on npmjs.org.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships with an npm new enough for OIDC trusted publishing. The
      # package's engines floor still applies to consumers; this only affects
      # how CI itself publishes.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")

          # Idempotent: the bootstrap release (first publish done manually while
          # wiring the trusted publisher) may already exist on the registry.
          if npm view "@feralfile/source-resolver@${VERSION}" version > /dev/null 2>&1; then
            echo "@feralfile/source-resolver@${VERSION} is already published; skipping."
            exit 0
          fi

          npm publish --access public --provenance

  verify-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - name: Verify npm package version
        run: |
          set -euo pipefail

          TAG="${{ github.event.release.tag_name }}"
          ATTEMPTS=10
          SLEEP_SECONDS=10

          for attempt in $(seq 1 "$ATTEMPTS"); do
            NPM_VERSION=$(npm view "@feralfile/source-resolver@${TAG}" version 2>/dev/null || true)
            if [ "$NPM_VERSION" = "$TAG" ]; then
              echo "npm version check passed: $NPM_VERSION"
              exit 0
            fi

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "npm reports '$NPM_VERSION', expected $TAG; retrying in ${SLEEP_SECONDS}s (${attempt}/${ATTEMPTS})"
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "npm version check failed: expected $TAG"
          exit 1
